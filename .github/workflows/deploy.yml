name: Deploy Backend

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          script: |
            mkdir -p /var/www/sramap/backend

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          source: "main.py,map_assets.py,queries.py,grid_filters.py,expansions.py,deep_dive.py,beacon.py, beacon_queries.py,pyproject.toml,uv.lock,data/platforms.csv,vendor/__init__.py,vendor/qf_tiler.py,vendor/qf_ingester.py"
          target: /var/www/sramap/backend
          strip_components: 0

      - name: Install dependencies and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          # Fail the step on any non-zero command. Without this a failed restart
          # (e.g. sudo asking for a password) was swallowed and the deploy went
          # green while the old process kept serving stale code.
          script_stop: true
          script: |
            cd /var/www/sramap/backend

            # Install uv if not present
            if ! command -v uv &> /dev/null; then
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"
            fi

            # Sync dependencies
            ~/.local/bin/uv sync

            # Restart the service. -n: never prompt for a password -- if the
            # NOPASSWD sudoers rule is missing this fails loudly instead of hanging.
            sudo -n systemctl restart seqout-backend

            # Health check: real failure, no swallow. Retry to let the workers
            # come up. If the service didn't start, the deploy now fails.
            curl -f --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8000/
