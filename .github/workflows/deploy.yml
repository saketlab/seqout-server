name: Deploy Backend

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          script: |
            mkdir -p /var/www/sramap/backend

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          source: "main.py,map_assets.py,queries.py,grid_filters.py,expansions.py,deep_dive.py,beacon.py, beacon_queries.py,pyproject.toml,uv.lock,data/platforms.csv,vendor/__init__.py,vendor/qf_tiler.py,vendor/qf_ingester.py"
          target: /var/www/sramap/backend
          strip_components: 0

      - name: Install dependencies and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd /var/www/sramap/backend

            if ! command -v uv &> /dev/null; then
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"
            fi

            ~/.local/bin/uv sync

            OLD_PID=$(systemctl show seqout-backend -p MainPID --value)

            sudo -n systemctl restart seqout-backend

            for i in $(seq 1 20); do
              sleep 2
              curl -fs http://127.0.0.1:8000/ >/dev/null && break
            done

            curl -fs http://127.0.0.1:8000/ >/dev/null || {
              echo "::error::backend not answering on :8000 after restart"
              exit 1
            }

            NEW_PID=$(systemctl show seqout-backend -p MainPID --value)
            test "$NEW_PID" != "$OLD_PID" || {
              echo "::error::seqout-backend still running as PID $OLD_PID; restart did not take"
              exit 1
            }
