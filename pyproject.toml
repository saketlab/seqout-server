[project]
name = "pysradb-server"
version = "0.1.0"
description = "HTTP server for pysraweb"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.121.3",
    "fastmcp<3",
    "instructor[groq]>=1.13.0",
    "pandas>=2.3.3",
    "psycopg[binary,pool]>=3.3.2",
    "slowapi>=0.1.9",
    "user-agents>=2.2.0",
    "geoip2>=4.8.0",
    "symspellpy>=6.7.8",
    "neo4j>=6.2.0",
    "pyarrow>=24.0.0",
    "numpy>=2.4.1",
    "i18n-iso-countries>=1.0.0",
]
